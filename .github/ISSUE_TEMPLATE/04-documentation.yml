name: Documentation Issue
description: Report missing, outdated or unclear documentation for kora_consumables.
title: '[Docs]: '
labels:
- documentation
- needs-triage
body:
- type: input
  id: page
  attributes:
    label: Documentation page or file
    placeholder: URL or path in kora_consumables
  validations:
    required: true
- type: textarea
  id: issue
  attributes:
    label: What is wrong or missing?
    description: Name the area that needs clarification, such as Item use, Status effects, Progress and cancellation, QBCore
      exports.
  validations:
    required: true
- type: textarea
  id: correction
  attributes:
    label: Suggested correction
